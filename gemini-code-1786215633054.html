<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse | Habit & Productivity Tracker</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Application Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-indigo-600 text-white rounded-xl shadow-lg shadow-indigo-500/30">
          <i data-lucide="activity" class="w-6 h-6"></i>
        </div>
        <span class="font-bold text-xl tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Pulse</span>
      </div>

      <!-- Navigation & Dark Mode Toggle -->
      <div class="flex items-center space-x-2 sm:space-x-4">
        <nav class="flex bg-slate-800 p-1 rounded-xl border border-slate-700/50">
          <button id="nav-dashboard" class="px-3 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 flex items-center space-x-2 bg-indigo-600 text-white shadow-sm">
            <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
            <span class="hidden sm:inline">Dashboard</span>
          </button>
          <button id="nav-analytics" class="px-3 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 flex items-center space-x-2 text-slate-400 hover:text-white">
            <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
            <span class="hidden sm:inline">Analytics</span>
          </button>
        </nav>

        <button id="theme-toggle" class="p-2 rounded-xl border border-slate-800 bg-slate-800/50 hover:bg-slate-800 text-slate-400 hover:text-white transition-colors">
          <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
          <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main View Area -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8">
    
    <!-- DASHBOARD VIEW -->
    <section id="view-dashboard" class="space-y-6">
      <!-- Progress Bar & View Mode Toggle -->
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 shadow-xl backdrop-blur-sm">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
          <div>
            <h2 class="text-xl font-bold text-white">Daily Progress</h2>
            <p class="text-sm text-slate-400">Keep up the streak! Complete your habits today.</p>
          </div>
          
          <!-- View Toggle -->
          <div class="inline-flex bg-slate-900/80 p-1 rounded-lg border border-slate-700/50 self-start sm:self-auto text-xs font-semibold">
            <button id="time-daily" class="px-3 py-1.5 rounded-md bg-indigo-600 text-white shadow">Daily</button>
            <button id="time-weekly" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-white">Weekly</button>
            <button id="time-monthly" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-white">Monthly</button>
          </div>
        </div>

        <!-- Overall Completion Bar -->
        <div class="space-y-2">
          <div class="flex justify-between text-xs font-semibold text-slate-400">
            <span id="progress-text">0 of 0 Completed</span>
            <span id="progress-percent">0%</span>
          </div>
          <div class="w-full h-3 bg-slate-900 rounded-full overflow-hidden border border-slate-700/30 p-0.5">
            <div id="progress-bar-fill" class="h-full bg-gradient-to-r from-indigo-500 to-indigo-400 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
          </div>
        </div>
      </div>

      <!-- Action & Filter Bar -->
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-semibold text-white flex items-center gap-2">
          Your Habits
        </h3>
        <button id="btn-open-modal" class="inline-flex items-center space-x-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold px-4 py-2 rounded-xl shadow-lg shadow-indigo-600/20 transition-all hover:scale-[1.02] active:scale-[0.98]">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>Add Habit</span>
        </button>
      </div>

      <!-- Habits List -->
      <div id="habits-list" class="space-y-3">
        <!-- Rendered dynamically via JavaScript -->
      </div>
    </section>

    <!-- ANALYTICS VIEW -->
    <section id="view-analytics" class="space-y-6 hidden">
      <!-- Summary Cards -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 flex items-center space-x-4">
          <div class="p-3 bg-indigo-500/10 text-indigo-400 rounded-xl border border-indigo-500/20">
            <i data-lucide="check-circle-2" class="w-8 h-8"></i>
          </div>
          <div>
            <p class="text-sm font-medium text-slate-400">Total Completions</p>
            <p id="stat-total-completed" class="text-3xl font-extrabold text-white">0</p>
          </div>
        </div>

        <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 flex items-center space-x-4">
          <div class="p-3 bg-amber-500/10 text-amber-400 rounded-xl border border-amber-500/20">
            <i data-lucide="flame" class="w-8 h-8"></i>
          </div>
          <div>
            <p class="text-sm font-medium text-slate-400">Best Streak</p>
            <p id="stat-best-streak" class="text-3xl font-extrabold text-white">0 Days</p>
          </div>
        </div>
      </div>

      <!-- Consistency Visualizer (30-day view) -->
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 space-y-4">
        <div>
          <h3 class="text-lg font-bold text-white">30-Day Completion Consistency</h3>
          <p class="text-sm text-slate-400">Visualizing your daily habit activity over the last month.</p>
        </div>
        
        <!-- Activity Heatmap Grid -->
        <div id="analytics-grid" class="grid grid-cols-6 sm:grid-cols-10 gap-2 pt-2">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </section>

  </main>

  <!-- Add/Edit Habit Modal -->
  <div id="modal-habit" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-5 transform transition-all scale-100">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 id="modal-title" class="text-lg font-bold text-white">Add New Habit</h3>
        <button id="btn-close-modal" class="text-slate-400 hover:text-white transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="form-habit" class="space-y-4">
        <input type="hidden" id="habit-id" value="" />
        
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">HABIT NAME</label>
          <input type="text" id="habit-title" required placeholder="e.g. Morning Meditation" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all text-sm" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">COLOR TAG</label>
          <div class="flex items-center space-x-3 pt-1" id="color-selector">
            <button type="button" data-color="indigo" class="w-8 h-8 rounded-full bg-indigo-500 ring-2 ring-indigo-400 ring-offset-2 ring-offset-slate-900 transition-all"></button>
            <button type="button" data-color="emerald" class="w-8 h-8 rounded-full bg-emerald-500 transition-all"></button>
            <button type="button" data-color="amber" class="w-8 h-8 rounded-full bg-amber-500 transition-all"></button>
            <button type="button" data-color="rose" class="w-8 h-8 rounded-full bg-rose-500 transition-all"></button>
            <button type="button" data-color="sky" class="w-8 h-8 rounded-full bg-sky-500 transition-all"></button>
          </div>
        </div>

        <div class="pt-4 flex justify-end space-x-3">
          <button type="button" id="btn-cancel-modal" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-400 hover:text-white transition-colors">Cancel</button>
          <button type="submit" class="px-5 py-2 rounded-xl text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/20 transition-all">Save Habit</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
